<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Grading System</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: url('login.jpg') no-repeat center center/cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      animation: backgroundMove 20s infinite alternate ease-in-out;
    }

    @keyframes backgroundMove {
      0% { background-position: center top; }
      50% { background-position: center center; }
      100% { background-position: center bottom; }
    }

    .container {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      width: 360px;
      text-align: center;
      animation: popUp 1.2s ease forwards;
      transform: translateY(20px);
      opacity: 0;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    @keyframes popUp {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .container:hover {
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      transform: scale(1.02);
    }

    .typing-text {
      margin-bottom: 25px;
      color: black;
      font-size: 28px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      width: 0;
      margin-left: auto;
      margin-right: auto;
      animation: typing 2.5s steps(20, end) forwards;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    .input-box, .select-box {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      background: chocolate;
      color: white;
      text-align: center;
      outline: none;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
      transition: background 0.3s, box-shadow 0.3s;
    }

    .input-box::placeholder {
      color: #eee;
    }

    .input-box:focus, .select-box:focus {
      background: #d2691e;
      box-shadow: 0 0 8px 2px rgba(255, 140, 0, 0.5), inset 0 0 5px rgba(0,0,0,0.3);
    }

    .select-box option {
      color: black;
    }

    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      background: linear-gradient(90deg, #6a00f4, #3b82f6);
      border: none;
      border-radius: 30px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.4s, transform 0.3s;
    }

    .btn:hover {
      background: linear-gradient(90deg, #3b82f6, #6a00f4);
      transform: scale(1.08);
      box-shadow: 0 5px 15px rgba(58, 125, 255, 0.6);
    }

    @media (max-width: 400px) {
      .container {
        width: 90%;
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 class="typing-text">Welcome!</h2>
    <form action="welcome.php" method="POST">
      <select class="select-box" name="role" required>
        <option value="">Select Role</option>
        <option value="admin">Admin</option>
        <option value="user">User</option>
      </select>

      <input type="text" class="input-box" name="username" placeholder="Username" required>
      <input type="password" class="input-box" name="password" placeholder="Password" required>
      <button type="submit" class="btn">Login</button>
    </form>
  </div>

</body>
</html>
