<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(45deg, #1f2a44, #405876);
            color: white;
            text-align: center;
            padding: 100px 20px;
            margin: 0;
        }

        h1 {
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 12px rgba(0, 0, 0, 0.5);
        }

        p {
            font-size: 22px;
            margin-bottom: 30px;
            color: #f0f0f0;
        }

        .button {
            background: #007bff;
            color: white;
            padding: 14px 30px;
            border: none;
            cursor: pointer;
            margin: 15px;
            font-size: 18px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            transition: all 0.4s ease;
        }

        .button:hover {
            background: #0056b3;
            transform: scale(1.05);
        }

        .button:active {
            transform: scale(0.95);
        }

        .button .icon {
            margin-right: 10px;
        }

        .logout-button {
            background: #dc3545;
        }

        .logout-button:hover {
            background: #c82333;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .card {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            margin-bottom: 40px;
        }

    
        .btn-container {
            margin-top: 40px;
        }

        .icon {
            font-size: 20px;
        }

        /* Icon styles */
        .icon-button {
            font-size: 18px;
            margin-right: 10px;
        }

        .icon-button:hover {
            color: #ff6347;
        }

        /* Bounce animation for result button */
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .button-bounce {
            animation: bounce 1s infinite;
        }

        /* Card hover effect */
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        }

        /* Responsive styles */
        @media (max-width: 768px) {
            body {
                padding: 50px 20px;
            }

            h1 {
                font-size: 32px;
            }

            p {
                font-size: 18px;
            }

            .button {
                padding: 12px 25px;
                font-size: 16px;
            }

            .card h3 {
                font-size: 22px;
            }

            .btn-container {
                flex-direction: column;
            }
        }
    </style>

    <script>
        function checkResult() {
            var studentId = prompt("Enter Student ID:");
            if (studentId != null && studentId.trim() !== "") {
                window.location.href = "view_student.php?student_id=" + encodeURIComponent(studentId);
            }
        }
    </script>
</head>

<body>

    <div class="container">
        <h1>Welcome to Your Dashboard!</h1>
        <p>Your personalized hub for managing and viewing results.</p>

        <div class="btn-container">
            <!-- Logout button -->
            <form action="logout.php" method="POST" style="display:inline;">
                <button class="button logout-button" type="submit">
                    <span class="icon">🚪</span>Logout
                </button>
            </form>
            
            <!-- Check Result button with animation -->
            <button class="button button-bounce" onclick="checkResult()">
                <span class="icon">📊</span>Check Result
            </button>
        </div>

        

</body>

</html>
